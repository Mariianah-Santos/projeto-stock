<div class="main" *ngIf="isOpen">
    <div class="container-modal">
        <div class="modal-header">
            <h3>Adicionar Usuário</h3>
            <span (click)="close()">X</span>
        </div>
        <hr id="line-header">

        <div class="modal-body">
            <label for="name">Nome</label>
            <div class="input-false-div">
                <mat-icon class="user-mat">person</mat-icon>
                <input type="text" id="name" placeholder="Nome" [(ngModel)]="responsible.name" required>
            </div>

            <label for="email">Email</label>
            <div class="input-false-div">
                <mat-icon class="user-mat">email</mat-icon>
                <input type="email" id="email" placeholder="email@gmail.com" required [(ngModel)]="responsible.email">
            </div>

            <label for="password">Senha</label>
            <div class="input-false-div">
                <mat-icon class="user-mat">password</mat-icon>
                <input type="password" id="password" placeholder="*******" required minlength="6" [(ngModel)]="responsible.password">
            </div>

            <label for="tel">Telefone</label>
            <div class="input-false-div">
                <mat-icon class="user-mat">call</mat-icon>
                <input type="number" id="tel" placeholder="(xx)xxxxxxxx" required [(ngModel)]="responsible.telefone">
            </div>

            <label>Permissão:</label>
            <div class="input-false-div persmission-div">
                <div class="permission-item">
                    <mat-icon class="user-mat persmission">admin_panel_settings</mat-icon>
                    <label class="permission" for="admin">Administrador da Plataforma</label>
                    <input type="radio" id="admin" name="role" value="ADMIN" [(ngModel)]="responsible.role">
                </div>

                <div class="permission-item">
                    <mat-icon class="user-mat persmission">person</mat-icon>
                    <label class="permission" for="user">Usuário comum</label>
                    <input type="radio" id="user" name="role" value="USER" [(ngModel)]="responsible.role">
                </div>
            </div>

            <div class="modal-footer">
                <button id="btn-cancel" class="btn" (click)="close()">Cancelar</button>
                <button id="btn-add" class="btn" (click)="addResponsible()">Salvar</button>
            </div>
        </div>
    </div>
</div>
