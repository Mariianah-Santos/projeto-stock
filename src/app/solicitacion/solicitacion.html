<div class="main" *ngIf="isOpen">
    <div class="container-modal">
        <div class="modal-header">
            <h3>Solicitar o Produto</h3>
            <span (click)="close()">X</span>
        </div>

        <div class="modal-body">
            <table class="table-productList">
                <thead class="table-header">
                    <tr id="tr-header">
                        <th>Código</th>
                        <th>Nome</th>
                        <th>Categoria</th>
                    </tr>
                </thead>

                <tbody class="table-tbody disabledDiv">
                    <tr>
                        <td> {{ product?.code }} </td>
                        <td> {{ product?.name }} </td>
                        <td> {{ product?.category?.name }} </td>
                    </tr>
                </tbody>
            </table>

            <div class="modal-footer">
                <div class="request-info">
                    <label for="quantity">Quantidade</label>
                    <input id="quantity" type="number" min="1" [(ngModel)]="quantity"/>
                </div>
                <button id="btn-cancel" (click)="close()" class="btn">Cancelar</button>
                <button id="btn-request" class="btn" (click)="submitSolicitation()" [disabled]="submitting || !product || quantity < 1">Solicitar</button>
            </div>
        </div>
    </div>
</div>
